<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hill Climb Web</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: #0d1424;
        overflow: hidden;
      }
      canvas { display: block; }
      .hud {
        position: fixed; inset: 0 0 auto 0;
        display: flex; justify-content: space-between; gap: .8rem;
        padding: .8rem 1rem; pointer-events: none; color: #e6f2ff;
      }
      .panel {
        display: flex; gap: 1rem; flex-wrap: wrap;
        background: rgba(7,14,28,.55);
        border: 1px solid rgba(168,209,255,.25);
        border-radius: 12px; padding: .45rem .7rem;
      }
      .label { opacity: .75; font-size: .78rem; }
      .value { font-weight: 700; }
      .overlay { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
      .message {
        max-width: min(92vw, 620px); text-align: center;
        background: rgba(10,17,32,.72); border: 1px solid rgba(167,216,255,.35);
        border-radius: 14px; padding: 1rem 1.2rem; color: #eff8ff;
      }
      .hidden { opacity: 0; }
      kbd { border: 1px solid rgba(207,230,255,.45); border-radius: 6px; padding: .05rem .35rem; background: rgba(255,255,255,.08); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="panel">
        <div><div class="label">Distanz</div><div class="value" id="distance">0 m</div></div>
        <div><div class="label">Schwierigkeit</div><div class="value" id="difficulty">1.00x</div></div>
        <div><div class="label">Speed</div><div class="value" id="speed">0 km/h</div></div>
      </div>
      <div class="panel"><div><div class="label">Steuerung</div><div class="value"><kbd>←</kbd>/<kbd>→</kbd> fahren, <kbd>A</kbd>/<kbd>D</kbd> kippen, <kbd>R</kbd> reset</div></div></div>
    </div>
    <div class="overlay"><div class="message" id="statusBox"><h1>Hill Climb Web</h1><p>Zufällige Strecke, die mit Distanz schwieriger wird.</p></div></div>

    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
    <script>
      const { Engine, World, Bodies, Body, Events } = Matter;

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const distanceEl = document.getElementById('distance');
      const difficultyEl = document.getElementById('difficulty');
      const speedEl = document.getElementById('speed');
      const statusBox = document.getElementById('statusBox');

      const state = {
        keys: { left: false, right: false, tiltLeft: false, tiltRight: false },
        viewport: { width: window.innerWidth, height: window.innerHeight },
        gameOver: false,
        bestX: 0,
        generatedUntil: -1200,
      };

      const engine = Engine.create({ gravity: { x: 0, y: 1.15 } });
      engine.positionIterations = 10;
      engine.velocityIterations = 8;

      let car;
      const terrainBodies = [];

      function mulberry32(seed) {
        return function () {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function noise(i) {
        const r = mulberry32((i + 919) * 31337);
        return r() * 2 - 1;
      }
      function smoothNoise(x) {
        const i = Math.floor(x);
        const f = x - i;
        const a = noise(i);
        const b = noise(i + 1);
        const t = f * f * (3 - 2 * f);
        return a * (1 - t) + b * t;
      }

      function difficultyAt(x) {
        return 1 + Math.max(0, x) / 2400;
      }

      function terrainHeight(x) {
        const prog = Math.max(0, x) / 1800;
        const base = state.viewport.height * 0.72;
        const amp = 62 + prog * 26;
        const freq = 0.0019 + prog * 0.0006;
        const h1 = smoothNoise(x * freq) * amp;
        const h2 = smoothNoise(x * freq * 2.6 + 2400) * amp * 0.3;
        const h3 = Math.sin(x * freq * 0.55) * (16 + prog * 10);
        return base + h1 + h2 + h3;
      }

      function generateTerrainChunk(fromX, toX) {
        const step = 45;
        const verts = [];
        for (let x = fromX; x <= toX; x += step) {
          verts.push({ x, y: terrainHeight(x) });
        }
        verts.push({ x: toX, y: state.viewport.height + 1100 });
        verts.push({ x: fromX, y: state.viewport.height + 1100 });

        let ground = Bodies.fromVertices((fromX + toX) / 2, state.viewport.height, [verts], {
          isStatic: true,
          friction: 1.0,
          frictionStatic: 1.0,
          restitution: 0,
          slop: 0.02,
        }, true);

        if (!ground) return;
        if (Array.isArray(ground)) ground = ground[0];
        ground.renderColor = '#5ac878';
        terrainBodies.push(ground);
        World.add(engine.world, ground);
      }

      function ensureTerrain(cameraX) {
        const target = cameraX + state.viewport.width + 1800;
        while (state.generatedUntil < target) {
          const from = state.generatedUntil;
          const to = from + 900;
          generateTerrainChunk(from, to);
          state.generatedUntil = to;
        }
      }

      function trimTerrain(cameraX) {
        const keepBehind = cameraX - 2200;
        while (terrainBodies.length && terrainBodies[0].position.x < keepBehind) {
          World.remove(engine.world, terrainBodies.shift());
        }
      }

      function createCar(x, y) {
        const chassis = Bodies.rectangle(x, y, 122, 36, {
          chamfer: { radius: 10 },
          friction: 0.9,
          frictionStatic: 1.0,
          restitution: 0,
          density: 0.0022,
          slop: 0.03,
        });
        return chassis;
      }

      function resetGame() {
        if (car) World.remove(engine.world, car);
        car = createCar(200, terrainHeight(200) - 80);
        World.add(engine.world, car);
        state.bestX = 0;
        state.gameOver = false;
        statusBox.classList.remove('hidden');
        statusBox.innerHTML = '<h1>Hill Climb Web</h1><p>Jetzt steuerbar & stabiler. Drücke <kbd>R</kbd> für Neustart.</p>';
      }

      function resize() {
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        state.viewport.width = window.innerWidth;
        state.viewport.height = window.innerHeight;
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      }

      function setupInput() {
        window.addEventListener('keydown', (e) => {
          if (e.code === 'ArrowLeft') state.keys.left = true;
          if (e.code === 'ArrowRight') state.keys.right = true;
          if (e.code === 'KeyA') state.keys.tiltLeft = true;
          if (e.code === 'KeyD') state.keys.tiltRight = true;
          if (e.code === 'KeyR') resetGame();
        });
        window.addEventListener('keyup', (e) => {
          if (e.code === 'ArrowLeft') state.keys.left = false;
          if (e.code === 'ArrowRight') state.keys.right = false;
          if (e.code === 'KeyA') state.keys.tiltLeft = false;
          if (e.code === 'KeyD') state.keys.tiltRight = false;
        });
      }

      function applyControls() {
        if (!car || state.gameOver) return;
        const accel = (state.keys.right ? 1 : 0) - (state.keys.left ? 1 : 0);
        const tilt = (state.keys.tiltRight ? 1 : 0) - (state.keys.tiltLeft ? 1 : 0);
        const diff = difficultyAt(state.bestX);

        Body.applyForce(car, { x: car.position.x, y: car.position.y + 10 }, { x: accel * 0.0015 * diff, y: 0 });
        Body.setAngularVelocity(car, car.angularVelocity * 0.94 + tilt * 0.005);

        const maxVX = 16 + diff * 1.2;
        if (Math.abs(car.velocity.x) > maxVX) {
          Body.setVelocity(car, { x: Math.sign(car.velocity.x) * maxVX, y: car.velocity.y });
        }
      }

      function updateState() {
        if (!car) return;
        state.bestX = Math.max(state.bestX, car.position.x);

        const crashed = Math.abs(car.angle) > Math.PI * 0.92 || car.position.y > terrainHeight(car.position.x) + 260;
        if (!state.gameOver && crashed) {
          state.gameOver = true;
          statusBox.classList.remove('hidden');
          statusBox.innerHTML = `<h1>Crash!</h1><p>${Math.max(0, Math.floor(state.bestX / 10))} m geschafft. <kbd>R</kbd> zum Neustart.</p>`;
        }

        if (!state.gameOver && state.bestX > 160) statusBox.classList.add('hidden');
      }

      function drawBackground(cameraX, cameraY) {
        const w = state.viewport.width;
        const h = state.viewport.height;
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#173054');
        g.addColorStop(1, '#0d1424');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = 'rgba(255,255,255,.08)';
        for (let i = 0; i < 7; i++) {
          const mx = ((i * 340 - cameraX * 0.15) % (w + 240)) - 120;
          const my = 120 + (i % 3) * 42 - cameraY * 0.05;
          ctx.beginPath();
          ctx.arc(mx, my, 40 + (i % 2) * 18, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawTerrain(cameraX, cameraY) {
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#5cd17d';
        ctx.lineWidth = 12;
        ctx.beginPath();
        const start = cameraX - 220;
        const end = cameraX + state.viewport.width + 260;
        for (let x = start; x <= end; x += 20) {
          const y = terrainHeight(x) - cameraY;
          if (x === start) ctx.moveTo(x - cameraX, y);
          else ctx.lineTo(x - cameraX, y);
        }
        ctx.stroke();
      }

      function drawCar(cameraX, cameraY) {
        const x = car.position.x - cameraX;
        const y = car.position.y - cameraY;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(car.angle);
        ctx.fillStyle = '#ffc24c';
        ctx.fillRect(-61, -18, 122, 36);
        ctx.fillStyle = '#d5911f';
        ctx.fillRect(8, -31, 36, 13);
        ctx.fillStyle = '#8ddbff';
        ctx.fillRect(14, -28, 24, 9);
        ctx.restore();
      }

      function updateHud() {
        distanceEl.textContent = `${Math.max(0, Math.floor(state.bestX / 10))} m`;
        difficultyEl.textContent = `${difficultyAt(state.bestX).toFixed(2)}x`;
        speedEl.textContent = `${Math.max(0, Math.round(car.velocity.x * 8.5))} km/h`;
      }

      function frame() {
        applyControls();
        Engine.update(engine, 1000 / 60);
        updateState();

        const cameraX = Math.max(0, car.position.x - state.viewport.width * 0.3);
        const cameraY = car.position.y - state.viewport.height * 0.4;

        ensureTerrain(cameraX);
        trimTerrain(cameraX);

        drawBackground(cameraX, cameraY);
        drawTerrain(cameraX, cameraY);
        drawCar(cameraX, cameraY);
        updateHud();
        requestAnimationFrame(frame);
      }

      Events.on(engine, 'beforeUpdate', () => {
        if (state.gameOver) {
          Body.setAngularVelocity(car, car.angularVelocity * 0.95);
          Body.setVelocity(car, { x: car.velocity.x * 0.995, y: car.velocity.y });
        }
      });

      function init() {
        resize();
        setupInput();
        state.generatedUntil = -1200;
        generateTerrainChunk(-1200, 3200);
        state.generatedUntil = 3200;
        resetGame();
        requestAnimationFrame(frame);
      }

      window.addEventListener('resize', resize);
      init();
    </script>
  </body>
</html>
